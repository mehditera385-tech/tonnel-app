<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TONNEL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#050d10;--bg2:#0a1a1fee;--line:#163840;--cy:#2fb5ad;--cy2:#7ff0e0;--tx:#e8f6f4;--mu:#7f9fa6;--ok:#35e0a1;--er:#ff6b7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 60% at 50% -10%,#0d3a40 0%,transparent 60%),var(--bg)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.5}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.view{flex:1;overflow-y:auto;padding:16px 18px 24px;display:none}
.view.on{display:block}
h1{font-size:21px;margin-bottom:6px}
p.s{color:var(--mu);font-size:13px;line-height:1.9}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:700 16px Tahoma,sans-serif;color:#03201f;background:linear-gradient(135deg,var(--cy2),var(--cy));box-shadow:0 8px 28px #2fb5ad44;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#0a1a1f;color:var(--cy2);border:1px solid var(--cy);box-shadow:none}
.btn:disabled{background:#10282c;color:#5f8288;border-color:#10282c;box-shadow:none;cursor:default}
input{width:100%;background:#061418;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--tx);font:15px Tahoma,sans-serif;margin-top:8px;outline:none}
input:focus{border-color:var(--cy)}
label{font-size:13px;color:var(--mu);display:block;margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}
.ltr{direction:ltr;unicode-bidi:embed}
.msg{min-height:20px;margin-top:12px;font-size:13px;text-align:center}
.msg.e{color:var(--er)}.msg.o{color:var(--ok)}
#gate{text-align:center;padding-top:5vh}
#gate img{display:block;max-width:100%;max-height:48vh;margin:0 auto 14px;border-radius:14px;box-shadow:0 0 40px #2fb5ad44}
.step{display:flex;align-items:center;gap:12px;margin-top:12px;text-align:start}
.step b{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--cy);color:var(--cy2);display:grid;place-items:center;font-size:14px}
.top{display:flex;justify-content:flex-end}
#lb{background:#0a1a1f;border:1px solid var(--line);color:var(--cy2);border-radius:20px;padding:8px 14px;font:13px Tahoma,sans-serif;cursor:pointer}
.bal{text-align:center;margin-top:8px}
.bal small{color:var(--mu);font-size:13px}
.bal div{font-size:38px;font-weight:700;color:var(--cy2)}
.ringwrap{position:relative;width:250px;height:250px;margin:12px auto 74px}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
#mlogo{position:absolute;inset:22px;width:206px;height:206px;border-radius:50%;object-fit:cover;object-position:50% 14%;opacity:.7;transition:.4s}
.ringwrap.on #mlogo{opacity:1;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 50px #2fb5adcc}}
.ringwrap .in{position:absolute;left:0;right:0;bottom:-64px;text-align:center}
.cnt{font-size:26px;font-weight:700}
.cnt small{display:block;font-size:12px;color:var(--cy2);font-weight:400}
@media(prefers-reduced-motion:reduce){.ringwrap.on #mlogo{animation:none}}
nav{direction:ltr;display:flex;align-items:flex-end;background:#040a0cf2;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:11px Tahoma,sans-serif;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--cy2)}
nav button.mid svg{width:30px;height:30px;padding:10px;box-sizing:content-box;border-radius:50%;background:linear-gradient(135deg,#0f3a40,#0a1a1f);border:1px solid var(--cy);margin-top:-22px;box-shadow:0 0 18px #2fb5ad66}
#nav{display:none}
.st{font-size:12px;padding:3px 10px;border-radius:20px}
.st.pending{background:#3a2f0f;color:#ffcb5c}.st.paid,.st.done{background:#0e3326;color:var(--ok)}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9}
#ov.on{display:flex}
#ov .box{background:#0a1a1f;border:1px solid var(--cy);border-radius:20px;padding:18px;width:80%;max-width:300px}
#ov .btn{margin-top:10px}
.pr{font-size:34px;font-weight:700;color:var(--cy2);text-align:center}
#cg{font-size:14px;text-align:center;margin-top:4px}
.md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9}.md.on{display:flex}.md .box{background:#0a1a1f;border:1px solid #2fb5ad;border-radius:20px;padding:18px;width:88%;max-width:340px;max-height:80vh;overflow:auto;font-size:13px;line-height:1.9}
.top{gap:8px}.tb{background:#0a1a1f;border:1px solid var(--line);color:var(--cy2);border-radius:20px;padding:8px 14px;font:13px Tahoma,sans-serif;cursor:pointer}.tb img{width:20px;height:20px;border-radius:50%;vertical-align:middle}
</style>

</nav>

$("v-chart").insertAdjacentHTML("beforeend",'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b data-i="bt"></b><div id="btm" class="t ltr" style="width:38px;height:38px;border-radius:50%;border:3px solid #163840;display:grid;place-items:center;font-size:11px">30</div></div><div class="m" style="font-size:11px;margin:6px 0" data-i="bmx"></div><div id="bch"></div><div style="display:flex;gap:10px;margin-top:10px"><button class="btn" id="bbuy" style="background:#35e0a1;box-shadow:none" data-i="bb"></button><button class="btn" id="bsell" style="background:#ff6b7a;box-shadow:none;color:#2a0509" data-i="bs"></button></div><div class="m" id="bst" style="font-size:12px;margin-top:8px"></div><div id="bhs"></div></div>');
$("bch").innerHTML=[5,10,20].map(p=>'<button class="tb" data-bp="'+p+'" style="padding:5px 12px;margin-right:6px;font-size:12px">'+p+'%</button>').join("");
function marksB(){document.querySelectorAll("[data-bp]").forEach(b=>{const on=+b.dataset.bp===pct;b.style.color=on?"#7ff0e0":"#7f9fa6";b.style.borderColor=on?"#2fb5ad":"#163840"})}
document.querySelectorAll("[data-bp]").forEach(b=>b.onclick=()=>{pct=+b.dataset.bp;marksB()});marksB();
async function bet(side){const d=await call("/api/bet",{side,pct});if(d.error){tst(t(EM[d.error]||"gerr"));return}apply(d);tst(t("bo"),1)}
$("bbuy").onclick=()=>bet("buy");$("bsell").onclick=()=>bet("sell");
function renderB(){if(!S)return;const L2=S.bets||[];
 if(lastBet===-1)lastBet=L2.length?L2[0].id:0;
 else if(L2.length&&L2[0].id>lastBet){lastBet=L2[0].id;const x=L2[0];tst(x.status==="win"?t("bw")+" +"+((x.payout-x.stake)/1e6).toFixed(2):x.status==="lose"?t("bl")+" −"+(x.stake/1e6).toFixed(2):t("bd"),x.status==="win")}
 $("bhs").innerHTML=L2.map(x=>'<div class="row"><span>'+(x.side==="buy"?"↑":"↓")+" "+(x.stake/1e6).toFixed(2)+'</span><b style="color:'+(x.status==="win"?"#35e0a1":x.status==="lose"?"#ff6b7a":"#7f9fa6")+'">'+(x.status==="win"?"+"+((x.payout-x.stake)/1e6).toFixed(2):x.status==="lose"?"−"+(x.stake/1e6).toFixed(2):"=")+'</b></div>').join("")}
setInterval(()=>{if(!S)return;const now=Date.now()/1000+off,o=S.bet;
 $("bbuy").disabled=$("bsell").disabled=!!o;
 if(o){const left=Math.ceil(o.t0+30-now);$("btm").textContent=Math.max(0,left);$("btm").style.borderTopColor="#2fb5ad";$("bst").textContent=(o.side==="buy"?"↑ ":"↓ ")+(o.stake/1e6).toFixed(2)+" @ $"+o.p0;
  if(left<=0&&!SET){SET=1;call("/api/state").then(d=>{if(!d.error)apply(d);SET=0})}}
 else{$("btm").textContent="30";$("btm").style.borderTopColor="#163840";$("bst").textContent=t("bday")+": "+S.bets_today+"/15"}},1000);
/* hooks */
const s1=stat;stat=function(){s1();renderT();renderW();renderB();showW();$("vbtn").style.display=S.verified?"none":"block";$("xbtn").style.display=(S.verified&&S.wleft<1)?"block":"none"};
const sl1=setLang;setLang=function(l){sl1(l);if(S){renderT();renderW()}showW();marksB()};
const tb1=tab;tab=function(x){tb1(x);if(x==="wallet")quote();if(x==="tasks")showFT(ft)};
/* welcome voice */
function say(){if(said>1||!window.speechSynthesis)return;said++;try{const u=new SpeechSynthesisUtterance("Welcome to Crypto Tonnel");u.lang="en-US";speechSynthesis.speak(u)}catch(e){}}
setTimeout(say,900);document.addEventListener("pointerdown",say,{once:true});
showFT("t");setLang(lang);quote();setInterval(quote,60000);
})();
